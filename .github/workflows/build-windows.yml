name: Build Windows app

# Builds MyVault on a real Windows runner and keeps the finished installers
# here, in this private repository, for the owner to download and hand out.
#
# Nothing is published anywhere. The source, the history, the build logs and the
# installers are all visible only to the owner and any collaborators.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the Windows installer and portable exe
        run: npm run dist:win

      # Download these from the run's summary page, then hand the .exe to a shop
      # however you like — USB stick, email, WeTransfer.
      - name: Installer
        uses: actions/upload-artifact@v4
        with:
          name: MyVault-windows-installer
          path: release/*setup*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Portable build
        uses: actions/upload-artifact@v4
        with:
          name: MyVault-windows-portable
          path: release/*portable*.exe
          if-no-files-found: error
          retention-days: 90
