name: Build Windows app

# Everything here fits inside GitHub's free allowance for a private repository
# (2,000 runner minutes and 500 MB of artifact storage per month).
#
#   • Tests run on every push. They run on Linux, the cheapest runner, and take
#     a couple of minutes — a few hundred pushes a month would still fit.
#
#   • The Windows installer is BUILT on every push, so a break in the packaging
#     — the NSIS script, the icon, the licence encoding — is caught here rather
#     than the first time you try to hand the app to a shop. Runner minutes are
#     the plentiful allowance.
#
#   • The installers are only KEPT when you ask for them: press "Run workflow"
#     on this page, or push a version tag. Storage is the scarce allowance —
#     each build is about 175 MB against 500 MB — so an ordinary push verifies
#     the build and then throws it away.
#
#   • Kept installers expire after 7 days. Download the one you want and hand it
#     out; it does not need to sit here.
#
#   • For a version you actually want to keep, fill in "Release tag" when you
#     press "Run workflow" (or push a v… tag). That publishes a Release with the
#     two .exe files attached: a permanent, one-click download that does not
#     expire and does not count against the 500 MB artifact allowance.
#
# You can also skip all of this and build on your own Windows PC for nothing:
#   npm install && npm run dist:win

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, e.g. v1.0.0 — leave blank to just build and keep the files for 7 days'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the Windows installer and portable exe
        run: npm run dist:win

      # NSIS prints a warning for every installer string a language has no
      # translation for and falls back to English on. They are cosmetic, so
      # warningsAsErrors is off — but that means the log is the only place a
      # genuine packaging warning would show up. Worth a glance when it changes.
      - name: Confirm both installers were produced
        shell: pwsh
        run: |
          $exes = Get-ChildItem release -Filter *.exe
          $exes | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }
          if ($exes.Count -lt 2) { throw "expected an installer and a portable exe, found $($exes.Count)" }

      # Kept only for a tag or a manual run — see the note at the top about
      # storage. Download these from the run's summary page, then hand the .exe
      # to a shop however you like: USB stick, email, WeTransfer.
      - name: Installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MyVault-windows-installer
          # latest.yml is the small file the in-app updater reads to learn what
          # the newest version is and what its installer should hash to. Without
          # it beside the .exe, "Check now" finds nothing.
          path: |
            release/*setup*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

      - name: Portable build
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MyVault-windows-portable
          path: release/*portable*.exe
          if-no-files-found: error
          retention-days: 7

  # Turns a build into something you can download in one click, months from now,
  # from the repository's Releases page — no zip to unpack, no expiry date.
  # The release stays private because the repository is private.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the tag and publish the release. Nothing else is granted.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag push names itself; a manual run uses the tag you typed in.
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          ls -l release

          cat > notes.md <<'NOTES'
          MyVault — the offline stock book for small shops.

          **MyVault-Setup.exe** — the normal installer. Run it, choose your language,
          and MyVault appears in the Start menu. Windows SmartScreen will say the
          publisher is unknown, because the file is not code-signed: choose
          **More info → Run anyway**.

          **MyVault-portable.exe** — nothing to install. Runs from the folder it sits
          in (a USB stick is fine) and keeps its data beside itself.

          Everything stays on the PC. The app has no internet access at all.

          © Aristotelis Katsigiannis. Free to use — see LICENSE.
          NOTES

          # Re-running the same tag replaces the files rather than failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe --clobber
          else
            gh release create "$TAG" release/*.exe \
              --target "$GITHUB_SHA" \
              --title "MyVault $TAG" \
              --notes-file notes.md
          fi

          gh release view "$TAG" --json tagName,assets \
            --jq '"published \(.tagName): " + ([.assets[].name] | join(", "))'

      # The app's own updater cannot read the release above: this repository is
      # private, so GitHub answers 404 to a shop that has no token. The same
      # files therefore go to a second, public repository that holds downloads
      # and nothing else — no source, no history, no build logs.
      #
      # That push needs a token with write access to the other repository, since
      # the built-in GITHUB_TOKEN only reaches this one. Without the secret the
      # step says so and the build still succeeds; only the in-app updater is
      # left with nothing to find. See "Publishing updates" in the README.
      - name: Publish to the public downloads repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          DOWNLOADS_REPO: aristoteleska-cmd/MyVault-releases
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::RELEASES_TOKEN is not set — skipping the public downloads repo."
            echo "The in-app updater will not see $TAG until this release is published there."
            exit 0
          fi

          if ! gh repo view "$DOWNLOADS_REPO" >/dev/null 2>&1; then
            echo "::warning::$DOWNLOADS_REPO is not reachable with this token — skipping."
            exit 0
          fi

          # latest.yml is what the updater actually reads; without it the .exe
          # files are just files and no shop will ever be offered them.
          test -f release/latest.yml || { echo "::error::latest.yml is missing"; exit 1; }

          if gh release view "$TAG" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe release/latest.yml \
              --repo "$DOWNLOADS_REPO" --clobber
          else
            gh release create "$TAG" release/*.exe release/latest.yml \
              --repo "$DOWNLOADS_REPO" \
              --title "MyVault $TAG" \
              --notes-file notes.md
          fi

          gh release view "$TAG" --repo "$DOWNLOADS_REPO" --json tagName,assets \
            --jq '"downloads repo has \(.tagName): " + ([.assets[].name] | join(", "))'
